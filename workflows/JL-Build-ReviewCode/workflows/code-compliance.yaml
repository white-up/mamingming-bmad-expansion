# 代码规约检查子工作流配置
name: "JL-Build-ReviewCode-CodeCompliance"
description: "代码规约检查子工作流，检查命名规范、异常处理、日志规范、注释规范"
author: "JL"

# 这是由 JL-Build-ReviewCode/workflow.yaml 调用的子工作流
parent_workflow: "{project-root}/_bmad/bmm/workflows/JL-Build-ReviewCode/workflow.yaml"

# 从父工作流继承的关键变量
config_source: "{project-root}/_bmad/bmm/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# 模块路径和组件文件
installed_path: "{project-root}/_bmad/bmm/workflows/JL-Build-ReviewCode/workflows"
template: false
instructions: "{installed_path}/code-compliance-instructions.md"
validation: "{project-root}/_bmad/bmm/workflows/JL-Build-ReviewCode/checklist.md"

# 知识库引用
knowledge_base:
  - "Java编码规范"

# 运行时输入
inputs:
  code_context: ""
  output_dir: ""
  resume_mode: false

# 输出
outputs:
  compliance_score: "代码规约得分"
  compliance_findings: "发现的问题列表"

# 配置
autonomous: false

# 检查项
check_items:
  - id: "naming"
    name: "Java 命名规范"
    weight: 25
  - id: "exception"
    name: "异常处理规范"
    weight: 30
  - id: "logging"
    name: "日志规范"
    weight: 20
  - id: "comment"
    name: "注释规范"
    weight: 25
