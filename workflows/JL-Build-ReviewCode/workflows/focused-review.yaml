# 聚焦审查子工作流配置
name: "JL-Build-ReviewCode-FocusedReview"
description: "聚焦代码审查子工作流，针对特定领域进行深度审查"
author: "JL"

# 这是由 JL-Build-ReviewCode/workflow.yaml 调用的子工作流
parent_workflow: "{project-root}/_bmad/bmm/workflows/JL-Build-ReviewCode/workflow.yaml"

# 从父工作流继承的关键变量
config_source: "{project-root}/_bmad/bmm/config.yaml"
output_folder: "{config_source}:output_folder"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
date: system-generated

# 模块路径和组件文件
installed_path: "{project-root}/_bmad/bmm/workflows/JL-Build-ReviewCode/workflows"
template: false
instructions: "{installed_path}/focused-review-instructions.md"
validation: "{project-root}/_bmad/bmm/workflows/JL-Build-ReviewCode/checklist.md"

# 运行时输入
inputs:
  code_context: ""
  focus_area: "" # 聚焦领域
  output_dir: ""

# 输出
outputs:
  report_file: "{output_dir}/CR_Focused_{focus_area}_{timestamp}.md"

# 配置
autonomous: false

# 可选的聚焦领域
focus_areas:
  - id: "code_compliance"
    name: "代码规约检查"
    sub_workflow: "code-compliance-instructions.md"
  - id: "architecture"
    name: "架构设计检查"
    sub_workflow: "architecture-review-instructions.md"
  - id: "security"
    name: "安全性检查"
    sub_workflow: "security-review-instructions.md"
  - id: "quality"
    name: "代码质量检查"
    checks:
      - "单元测试覆盖"
      - "代码复杂度"
      - "重复代码"
      - "性能隐患"
