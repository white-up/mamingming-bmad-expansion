name: "Generate Scenario Test Case"
description: "由 JL-AG-ARCH 专家编写场景测试报告"
author: "maxiangming"

config_source: "{project-root}/_bmad/bmm/config.yaml"
output_folder: "{config_source}:output_folder"
planning_artifacts: "{config_source}:planning_artifacts"
implementation_artifacts: "{config_source}:implementation_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"

# 定义输入
inputs:
  template_file:
    default: "../templates/JL-Template-Scenario-Test-Case.md"
  output_dir:
    default: "{inputs.output_dir}/quality"
  req_path:
    description: "项目文档"
    default:
      - "{planning_artifacts}"
      - "{output_folder}"

trigger:
  type: "command"
  pattern: "JL-Build-Scenario-Test-Case"

# 定义执行步骤
steps:
  - id: "step_1"
    name: "Check Test Context"
    agent: "JL-AG-QA"
    prompt: >
      **请先读取下列资源**：
      - 当前的上下文
      - 我的补充输入
      - `{inputs.req_path}` 项目文档
      
      **当前步骤目标**：
      评估加载的资源内容足够，可以明确测试规格生成的范围。基于你的评估情况按下列规则回复
      
      1. 如果上下文包含代码或日志：
         请简要概括你识别到的业务逻辑，并询问："我准备为 [功能/模块] 生成测试规格书。请确认：您需要覆盖哪些特定的异常场景或边界条件？或者直接生成默认的全量覆盖？"
      
      2. 如果上下文不明确：
         请回复："我已就绪。请选中相关代码或提供日志上下文。告诉我您希望生成针对哪个功能的测试规格书？"
      
      请勿在此步骤生成完整文档。

  - id: "step_2"
    name: "Wait for User Input"
    action: "wait_for_input"
    prompt: "等待用户确认测试范围..."

  - id: "step_3"
    name: "Load Code and Template"
    agent: "JL-AG-QA"
    prompt: >
      **请先读取下列资源**：
      - 当前的上下文
      - 我的补充输入
      - `{inputs.req_path}`项目文档
      - `{inputs.template_file}` 场景测试报告模板

      **阶段任务**：
      当前阶段你的唯一职责是根据输入信息，将项目文档、杂乱的开发日志（如果有）与代码片段，逆向还原为高质量的严格遵守`场景测试报告模板`的内容。你擅长通过技术细节（SQL/API）反推业务逻辑，并提供确定性的验证方案。

      **强制准则**：
      - 数据脱敏：严禁出现真实密钥、手机号或内网 IP，统一使用 `{{PLACEHOLDER}}` 替代。
      - 在生成正式内容前，请先在后台进行以下推演：
      1. 拓扑还原：识别场景涉及的服务组件、数据库表及外部 API 交互。
      2. 逻辑对齐：对比“业务描述”与“日志”，找出日志中体现的业务状态机（State Machine）变更。
      3. 变量锁定：识别在链路中传递的关键业务主键（如 TraceID, OrderID）。
      4. 覆盖补完：思考 Happy Path 之外，日志中未体现但必然存在的潜在故障/边界点。
      请直接以“# 场景测试报告”作为输出的开头。

  - id: "step_4"
    name: "Save Scenario Test Case Report"
    tool: "file-system"
    action: "write"
    params:
      path: "{inputs.output_dir}/Scenario_Test_Case_${timestamp}.md"
      content: "{step_3.output}"
