# Workflow 元数据
name: "Generate Business Knowledge Entry"
description: "由 JL-AG-ARCH 专家将问题和解决方案转换为结构化知识库条目"

# 核心配置：触发方式
trigger:
  type: "command"
  pattern: "JL-Ship-GenKnowledge"

# 定义输入
inputs:
  template_file:
    description: "知识库QA条目模板"
    default: "../templates/arch/JL-Template-Knowledge-Entry.md"
  output_dir:
    default: "{inputs.output_dir}/quality"

# 定义执行步骤
steps:
  - id: "step_1"
    name: "Prepare for Input"
    agent: "JL-AG-ARCH"
    prompt: >
      **请先读取下列资源**：
      - 当前的上下文
      - 我的补充输入
      
      **当前步骤目标**：
      评估加载的资源内容足够，可以明确用户的问题描述和解决方案。基于你的评估情况按下列规则回复

      1. 如果上下文包含完整的问题描述和解决方案：
         请简要概括你识别到的业功能逻辑，并询问："我准备为 [问题/解决方案概括] 生成知识库QA条目。请确认：是否为该问题和解决方案？"

      2. 如果上下文不明确：
         请回复："我已经准备好了，请提供您的问题描述和解决方案，我将为您整理成标准的知识库QA条目格式"

      请勿在此步骤生成完整文档。

  - id: "step_2"
    name: "Wait for User Input"
    # 这个步骤等待用户输入问题和解决方案
    action: "wait_for_input"
    prompt: "请提供问题描述和解决方案..."

  - id: "step_3"
    name: "Load Input and Template"
    agent: "JL-AG-ARCH"
    prompt: >
      **请先读取下列资源**：
      - 当前的上下文
      - 我的补充输入
      - `{input.template_file}`知识库QA条目模板
      
      **当前步骤目标**：
      将一线支持人员提供的“原始问题”和“琐碎的解决流程”转化为高质量、易于检索且严格遵守`知识库QA条目模板`的知识库条目。你生成的条目将直接用于语义搜索系统，因此“二级标题”的生成至关重要。
      
      **特别要求**：
      - **精准标题**：生成一个包含业务关键词、动作和对象的二级标题，确保搜索相似度匹配。
      - **高效内容**：将复杂的流程提炼为“一看就懂，上手就能做”的标准作业程序（SOP）。
      - 为了保证搜索系统能精准匹配，标题生成需遵循以下规则：
      1. **关键词前置**：将核心业务模块或产品名称放在最前面，使用【】标注。
        * *反例*：如何修改客户的收货地址？
        * *正例*：【客户管理】修改订单收货地址的操作流程
      2. **拒绝口语化**：删除“请问”、“帮我”、“解决一下”等无意义词汇。
      3. **包含特征词**：如果问题涉及特定错误码、状态或系统，必须在标题中体现。
      4. **覆盖同义词**：在括号中补充可能的搜索关键词（语义扩展）。
        * *示例*：【财务对账】发票红冲申请（退票/冲红/开票错误）
      - 解答内容总结准则：
      1. **结构化呈现**：使用“场景描述”、“操作步骤”、“注意事项”三个模块。
      2. **去冗余化**：剔除沟通中的客套话（如“好的”、“已收到”）、无关的排查废话。
      3. **动作导向**：步骤必须以动词开头（如：点击、打开、选择、输入）。
      
      请直接以“# 知识库QA条目”作为输出的开头。

  - id: "step_4"
    name: "Save Knowledge Entry"
    tool: "file-system"
    action: "write"
    params:
      path: "{inputs.output_dir}/Business_Knowledge_${timestamp}.md"
      content: "{step_3.output}"
