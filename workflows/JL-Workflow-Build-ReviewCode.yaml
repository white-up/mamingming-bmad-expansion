name: "Review Java Code"
description: "由 JL-AG-ARCH 专家对指定文件进行深度代码审查"

config_source: "{project-root}/_bmad/bmm/config.yaml"
output_folder: "{config_source}:output_folder"
planning_artifacts: "{config_source}:planning_artifacts"
implementation_artifacts: "{config_source}:implementation_artifacts"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
document_output_language: "{config_source}:document_output_language"

inputs:
  template_file:
    default: "../templates/JL-Template-CR.md"
  output_dir:
    default: "{inputs.output_dir}/quality"

# 核心配置：触发方式
trigger:
  type: "command"
  pattern: "JL-Build-ReviewCode"

# 定义执行步骤
steps:
  - id: "step_1"
    name: "Check Review Context"
    agent: "JL-AG-QA"
    prompt: >
      **请先读取下列资源**：
      - 当前的上下文
      - 我的补充输入
      - 未提交的代码
      
      **当前步骤目标**：
      评估加载的内容足够，可以明确需要审核的代码或文档的范围。基于你的评估情况按下列规则回复
      
      1. 如果选中了代码或文档：
         请简要概括代码或文档内容，并询问："我已准备好审查 [类名/模块]。请确认范围。"
         
      2. 如果未选中代码或文档：
         请回复："我已就绪。请选中您想要审查的 Java 代码、文档或提交记录。告诉我您希望我重点检查哪些方面？"
      
      请勿在此步骤生成完整报告。

  - id: "step_2"
    name: "Wait for User Input"
    action: "wait_for_input"
    prompt: "等待用户确认审查重点..."

  - id: "step_3"
    name: "Review Code Context"
    agent: "JL-AG-QA"
    prompt: >
      **请先读取下列资源**：
      - 当前的上下文
      - 我的补充输入
      - 用户指定的相关代码或文档
      - `{inputs.template_file}` 代码审查报告模板
      
      **阶段任务**：
      当前阶段你的唯一职责是根据限定范围，基于你的知识库（“Java编码规范”, "架构设计规范"）对代码或文档进行深度代码审查，最终严格遵循`代码审查报告模板`生成一份代码审查报告。
      
      请直接以“# 代码审查报告”作为输出的开头。

  - id: "step_4"
    name: "Save Review Report"
    tool: "file-system"
    action: "write"
    params:
      path: "{inputs.output_dir}/CR_${timestamp}.md"
      content: "{step_3.output}"
